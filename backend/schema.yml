  /api/v1/todos/next-position/:
    get:
      operationId: todos_next_position_retrieve
      description: |-
        다음 읽을 위치를 반환하는 API

        - 비로그인 사용자: 오늘 날짜 또는 가장 가까운 일정 반환
        - 로그인 사용자: 미완료 스케줄 중 첫 번째 반환

        [필수 파라미터]
        - plan_id: 플랜 ID

        [응답 예시]
        {
            "success": true,
            "status": "next_incomplete",  // 상태 코드
            "month": 3,
            "schedule_id": "123",
            "date": "2024-03-15"
        }

        [status 값]
        - "next_incomplete": 다음 미완료 일정
        - "all_completed": 모든 일정 완료
        - "today": 오늘 날짜 일정 (비로그인)
        - "nearest": 가장 가까운 일정 (비로그인, 오늘 일정 없을 때)
        - "no_schedule": 플랜에 일정이 없음
      parameters:
      - in: query
        name: plan_id
        schema:
          type: integer
        description: Active public reading plan ID.
        required: true
      tags:
      - todos
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextReadingPositionResponse'
          description: ''
