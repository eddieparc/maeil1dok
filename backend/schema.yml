  /api/v1/accounts/session/consume/:
    get:
      operationId: accounts_session_consume_retrieve
      description: |-
        Deprecated compatibility alias. Use `/api/v1/auth/session/consume/`.

        세션 브리지 코드 소비
        - 1회용 코드를 검증하고 쿠키 설정 후 리다이렉트
        - WebView에서 호출하여 인증 쿠키 획득
      parameters:
      - in: query
        name: code
        schema:
          type: string
          format: uuid
        description: Single-use session bridge code.
        required: true
      - in: query
        name: next
        schema:
          type: string
          default: /
        description: Frontend-relative redirect path. Unsafe values redirect to the
          frontend root.
      tags:
      - accounts
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: ''
        '302':
          description: Redirects to the frontend error route without a response body.
      deprecated: true
  /api/v1/accounts/session/issue/:
    post:
      operationId: accounts_session_issue_create
      description: |-
        Deprecated compatibility alias. Use `/api/v1/auth/session/issue/`.

        세션 브리지 코드 발급
        - 인증된 사용자만 접근 가능
        - 1회용 코드 생성 (TTL 60초)
        - Native 앱에서 호출하여 WebView 쿠키 동기화에 사용
      tags:
      - accounts
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBridgeIssueResponse'
          description: ''
        '409':
          description: A logout landed while this handoff was being issued, so no
            code was published. The caller must re-authenticate.
      deprecated: true
