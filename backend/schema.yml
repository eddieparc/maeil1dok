  /api/v1/bible-cache/{version}/{book}/{chapter}/:
    get:
      operationId: bible_cache_retrieve
      description: |-
        성경 본문 조회 API

        캐시에서 먼저 조회하고, 없으면 원본에서 가져와 캐싱 후 반환

        URL: GET /api/v1/bible-cache/{version}/{book}/{chapter}/

        Path Parameters:
            version: 번역본 코드 (GAE, KNT, HAN, SAE, SAENEW, COG, COGNEW)
            book: 성경책 코드 (gen, exo, mat 등)
            chapter: 장 번호

        Query Parameters:
            force_refresh: 캐시 무시하고 강제 새로고침 (optional, default=false)

        Response:
            200: {
                "success": true,
                "data": {
                    "version": "GAE",
                    "book": "gen",
                    "chapter": 1,
                    "content": "...",
                    "content_type": "html",
                    "from_cache": true
                }
            }
            400: 잘못된 요청 (지원하지 않는 버전, 잘못된 장 번호 등)
            503: 원본 서버 및 캐시 모두에서 데이터를 가져올 수 없음
      parameters:
      - in: path
        name: book
        schema:
          type: string
        required: true
      - in: path
        name: chapter
        schema:
          type: integer
        required: true
      - in: query
        name: force_refresh
        schema:
          type: boolean
          default: false
        description: Bypass the cache. Only the case-insensitive literal `true` enables
          this option, and staff authentication is then required; every other value
          is treated as false.
      - in: path
        name: version
        schema:
          type: string
        required: true
      tags:
      - bible-cache
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleContentResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleCacheErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleCacheErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibleCacheErrorResponse'
          description: ''
