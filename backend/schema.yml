  /api/v1/accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: |-
        Deprecated compatibility alias. Use `/api/v1/auth/logout/`.

        로그아웃 처리 - 토큰 만료 상태에서도 호출 가능해야 함

        AllowAny를 사용하는 이유:
        - access_token이 만료된 상태에서도 사용자가 로그아웃할 수 있어야 함
        - 쿠키 삭제는 인증 상태와 관계없이 수행되어야 함
      tags:
      - accounts
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
      deprecated: true
  /api/v1/accounts/merge-accounts/:
    post:
      operationId: accounts_merge_accounts_create
      description: |-
        Deprecated compatibility alias. Use `/api/v1/auth/merge-accounts/`.

        계정 병합 API

        사용자가 어느 계정을 유지할지 선택 가능:
        - keep_account='current': 현재 로그인한 계정 유지
        - keep_account='other': 소셜 연동된 다른 계정 유지

        선택된 계정의 데이터만 유지하고, 다른 계정의 소셜 연동만 이전
        삭제될 계정은 30일 후 삭제 예정으로 표시
      tags:
      - accounts
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      responses:
