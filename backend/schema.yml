        name: limit
        schema:
          type: integer
          default: 100
        description: Number of members to return (1-100).
      - in: query
        name: month
        schema:
          type: integer
        description: Calendar month (1-12); defaults to the current month.
      - in: query
        name: offset
        schema:
          type: integer
          default: 0
        description: Zero-based member offset.
      - in: query
        name: plan_id
        schema:
          type: integer
        description: Active plan belonging to the group; defaults to the group’s first
          active plan.
      - in: query
        name: year
        schema:
          type: integer
        description: Calendar year (1-9999); defaults to the current year.
      tags:
      - todos
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
