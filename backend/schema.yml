  /api/v1/todos/bible/personal-records/:
    get:
      operationId: todos_bible_personal_records_list
      description: 개인 읽기 기록 API
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - todos
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPersonalReadingRecordList'
          description: ''
    post:
      operationId: todos_bible_personal_records_create
      description: |-
        Race-safe upsert on (user, book, chapter).

        The check-then-create pattern that lived here previously raised an
        unhandled ``IntegrityError`` (HTTP 500) whenever two concurrent
        POSTs for the same (user, book, chapter) both saw
        ``existing = None`` and both tried to create — a real race the
        mobile "완독" double-tap could hit. Delegating to
        ``_upsert_personal_reading_record`` keeps the exposed semantics
        (201 on first insert, 200 on refresh) while closing the race the
        same way ``_upsert_hasena_record`` closes the Hasena race.
      tags:
      - todos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalReadingRecord'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonalReadingRecord'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PersonalReadingRecord'
        required: true
      security:
      - cookieJwtAuth: []
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalReadingRecord'
          description: ''
