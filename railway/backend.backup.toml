[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile.backup"
watchPatterns = ["backend/scripts/railway_mysql_backup.sh", "backend/Dockerfile.backup"]

[deploy]
startCommand = "/app/scripts/railway_mysql_backup.sh"
cronSchedule = "0 18 * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
