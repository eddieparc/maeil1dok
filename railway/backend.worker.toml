[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = ["backend/**", "railway/backend.worker.toml"]

[deploy]
startCommand = "celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 0
drainingSeconds = 30

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
