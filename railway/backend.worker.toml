[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = ["backend/**", "railway/backend.worker.toml"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 15
drainingSeconds = 30

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 0
