[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.beat"
watchPatterns = ["backend/**", "railway/backend.beat.toml"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 0
drainingSeconds = 30

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
