name: CI

on:
  # 수동 배포 트리거 (품질 잡은 push/PR 에서만; dispatch 는 곧장 deploy-oci)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'ops/**'
      - 'scripts/oci_mysql_backup.sh'
      - 'docker-compose.oci.yml'
      - '.env.oci.example'
      - 'docs/**'
      - '*.md'
      - 'tests/test_frontend_deployment_config.py'
      - 'tests/test_backend_ci_config.py'
      - 'tests/test_mobile_ci_config.py'
      - 'tests/test_observability_deployment_config.py'
      - 'tests/test_ops_alert_probe.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/uptime.yml'
      - '.github/known_hosts.oci'
  pull_request:
    # draft PR은 앱 CI를 skip하고 ready_for_review 전환 시 실행 (중간 푸시 비용 제거).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'ops/**'
      - 'scripts/oci_mysql_backup.sh'
      - 'docker-compose.oci.yml'
      - '.env.oci.example'
      - 'docs/**'
      - '*.md'
      - 'tests/test_frontend_deployment_config.py'
      - 'tests/test_backend_ci_config.py'
      - 'tests/test_mobile_ci_config.py'
      - 'tests/test_observability_deployment_config.py'
      - 'tests/test_ops_alert_probe.py'
      - '.github/workflows/ci.yml'
      - '.github/workflows/uptime.yml'
      - '.github/known_hosts.oci'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deployment: ${{ steps.filter.outputs.deployment }}
      mobile: ${{ steps.filter.outputs.mobile }}
      operations: ${{ steps.filter.outputs.operations }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            operations:
              - 'ops/**'
              - 'scripts/oci_mysql_backup.sh'
              - 'docker-compose.oci.yml'
              - '.env.oci.example'
              - 'tests/test_observability_deployment_config.py'
              - 'tests/test_ops_alert_probe.py'
              - '.github/workflows/ci.yml'
            deployment:
              - 'docs/**'
              - '*.md'
              - 'tests/test_frontend_deployment_config.py'
              - 'tests/test_backend_ci_config.py'
              - 'tests/test_mobile_ci_config.py'
              - 'tests/test_observability_deployment_config.py'
              - 'tests/test_ops_alert_probe.py'
              - 'tests/test_documentation_integrity.py'
              - '.github/workflows/ci.yml'
              - '.github/workflows/uptime.yml'
              - '.github/known_hosts.oci'

  backend-ci:
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 프로덕션과 동일한 MySQL 8 로 테스트 (레이스컨디션/제약 테스트는 실엔진 필요)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maeil1dok_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.test_settings
      KAKAO_CLIENT_ID: ci-kakao-client
      KAKAO_REDIRECT_URI: http://localhost/auth/kakao/callback
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_REDIRECT_URI: http://localhost/auth/google/callback
      APPLE_CLIENT_ID: ci.apple.client
      TEST_DB_ENGINE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: maeil1dok_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install MySQL build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Account migrations
        run: python manage.py migrate --noinput

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: OpenAPI schema drift gate
        run: python manage.py test tests.test_openapi_schema

      - name: Backend tests (full suite)
        run: python manage.py test accounts todos tests bible_cache

  deployment-config-ci:
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.deployment == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.operations == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deployment config tests
        run: >-
          python -m unittest
          tests.test_frontend_deployment_config
          tests.test_backend_ci_config
          tests.test_mobile_ci_config
          tests.test_observability_deployment_config
          tests.test_ops_alert_probe
          tests.test_documentation_integrity

      - name: Validate compose and observability configs
        run: |
          docker compose -f docker-compose.oci.yml config --no-interpolate -q
          docker run --rm -v "$PWD/ops/loki/config.yml:/etc/loki/config.yml:ro" \
            grafana/loki:3.5.5 -config.file=/etc/loki/config.yml -verify-config=true
          docker run --rm -v "$PWD/ops/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.10.2 validate /etc/alloy/config.alloy
          docker build -q -t maeil1dok-alert-probe-ci ops/probes
          docker run --rm --entrypoint bash maeil1dok-alert-probe-ci --version
          docker build -q -t maeil1dok-docker-proxy-ci ops/docker-proxy

  mobile-ci:
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.mobile == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  frontend-ci:
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Account contract tests
        run: npm run test

      # 타입체크는 기존 오류 175건(시그니처 102종)이 남아 있어 그대로는 붉다.
      # 래칫은 그 기준선을 고정하고 **새로 생긴 오류만** 실패시킨다 —
      # OpenAPI 스키마에서 생성한 API 계약 타입은 이것이 유일한 집행 수단이다.
      - name: Typecheck ratchet
        run: npm run typecheck:ratchet

      - name: Production build
        run: npm run build

  frontend-e2e:
    needs: changes
    if: (github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser behavior tests
        run: npm run test:e2e

  # ── 자동 배포 (urban-blanks 패턴) ─────────────────────────────────────
  # main push 에서 관련 품질 잡이 모두 성공하면 OCI VM 에 rsync → compose build/up → 라이브 스모크.
  # 시크릿: OCI_HOST / OCI_SSH_USER / OCI_SSH_KEY. .env.oci·.env.frontend.oci·cloudflared 설정은 VM 에 상주.
  deploy-oci:
    needs: [changes, backend-ci, frontend-ci, frontend-e2e, deployment-config-ci, mobile-ci]
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' ||
         needs.changes.outputs.operations == 'true')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    concurrency:
      group: deploy-oci
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
      OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 .github/known_hosts.oci ~/.ssh/known_hosts
          ssh-keygen -F "$OCI_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Sync code to VM
        run: |
          RSYNC_RSH="ssh -i ~/.ssh/deploy_key" rsync -az --delete \
            --exclude='.venv' --exclude='node_modules' --exclude='.nuxt' --exclude='.output' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env*' \
            backend frontend scripts ops docker-compose.oci.yml \
            "$OCI_SSH_USER@$OCI_HOST:/opt/maeil1dok/"

      - name: Build and roll out
        run: |
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" '
            set -e
            cd /opt/maeil1dok
            test -f .env.oci
            test -f .env.frontend.oci
            chmod 600 .env.oci .env.frontend.oci
            (crontab -l 2>/dev/null | grep -v oci_mysql_backup || true) | crontab -
            printf "%s\n" \
              "CRON_TZ=Asia/Seoul" \
              "20 3 * * * ubuntu cd /opt/maeil1dok && /opt/maeil1dok/scripts/oci_mysql_backup.sh >> /var/log/maeil1dok_mysql_backup.log 2>&1" \
              | sudo tee /etc/cron.d/maeil1dok-backup >/dev/null
            sudo chmod 644 /etc/cron.d/maeil1dok-backup
            # 웹 빌드 마커가 실제 커밋을 싣게 한다. rsync 는 .git 을 올리지 않고 빌드는
            # VM 안 도커에서 도니, 이 값을 넘기지 않으면 마커가 unknown 이 되고 셸 OTA
            # 게이트가 순서를 검증할 수 없다.
            export COMMIT_SHA='"${{ github.sha }}"'
            install -d -m 0750 -o 10001 -g 10001 /mnt/data/maeil1dok/loki
            install -d -m 0750 /mnt/data/maeil1dok/alloy
            install -d -m 0700 -o 10001 -g 10001 /mnt/data/maeil1dok/alerts
            docker compose -f docker-compose.oci.yml --env-file .env.oci build web celery-worker celery-beat frontend docker-proxy alert-probe
            docker compose -f docker-compose.oci.yml --env-file .env.oci up -d web celery-worker celery-beat frontend cloudflared loki docker-proxy alloy alert-probe
            docker image prune -f >/dev/null
          '

      - name: Smoke test (via Cloudflare Tunnel)
        run: |
          sleep 15
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.maeil1dok.app/health/ || true)
            ready=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.maeil1dok.app/ready/ || true)
            fe=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://maeil1dok.app/ || true)
            echo "attempt $i: api=/health/ $api, api=/ready/ $ready, frontend $fe"
            if [ "$api" = "200" ] && [ "$ready" = "200" ] && [ "$fe" = "200" ]; then echo "SMOKE OK"; exit 0; fi
            sleep 10
          done
          echo "SMOKE FAILED"; exit 1

      - name: Alert delivery canary
        run: |
          ssh -i ~/.ssh/deploy_key "$OCI_SSH_USER@$OCI_HOST" '
            set -e
            cd /opt/maeil1dok
            export COMMIT_SHA='"${{ github.sha }}"'
            docker compose -f docker-compose.oci.yml --env-file .env.oci \
              run --rm --no-deps --entrypoint /app/run.sh alert-probe --canary
          '
