name: CI

on:
  # 수동 배포 트리거 (품질 잡은 push/PR 에서만; dispatch 는 곧장 deploy-oci)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'docs/**'
      - '*.md'
      - 'tests/test_frontend_deployment_config.py'
      - 'tests/test_backend_ci_config.py'
      - 'tests/test_mobile_ci_config.py'
      - '.github/workflows/ci.yml'
  pull_request:
    # draft PR은 앱 CI를 skip하고 ready_for_review 전환 시 실행 (중간 푸시 비용 제거).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - 'docs/**'
      - '*.md'
      - 'tests/test_frontend_deployment_config.py'
      - 'tests/test_backend_ci_config.py'
      - 'tests/test_mobile_ci_config.py'
      - '.github/workflows/ci.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deployment: ${{ steps.filter.outputs.deployment }}
      mobile: ${{ steps.filter.outputs.mobile }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            deployment:
              - 'docs/**'
              - '*.md'
              - 'tests/test_frontend_deployment_config.py'
              - 'tests/test_backend_ci_config.py'
              - 'tests/test_mobile_ci_config.py'
              - 'tests/test_documentation_integrity.py'
              - '.github/workflows/ci.yml'

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # 프로덕션과 동일한 MySQL 8 로 테스트 (레이스컨디션/제약 테스트는 실엔진 필요)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maeil1dok_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.test_settings
      KAKAO_CLIENT_ID: ci-kakao-client
      KAKAO_REDIRECT_URI: http://localhost/auth/kakao/callback
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_REDIRECT_URI: http://localhost/auth/google/callback
      APPLE_CLIENT_ID: ci.apple.client
      TEST_DB_ENGINE: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: maeil1dok_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install MySQL build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Account migrations
        run: python manage.py migrate --noinput

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: OpenAPI schema drift gate
        run: python manage.py test tests.test_openapi_schema

      - name: Backend tests (full suite)
        run: python manage.py test accounts todos tests bible_cache

  deployment-config-ci:
    needs: changes
    if: (needs.changes.outputs.deployment == 'true' || needs.changes.outputs.frontend == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deployment config tests
        run: >-
          python -m unittest
          tests.test_frontend_deployment_config
          tests.test_backend_ci_config
          tests.test_mobile_ci_config
          tests.test_documentation_integrity

  mobile-ci:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  frontend-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Account contract tests
        run: npm run test

      # 타입체크는 기존 오류 175건(시그니처 102종)이 남아 있어 그대로는 붉다.
      # 래칫은 그 기준선을 고정하고 **새로 생긴 오류만** 실패시킨다 —
      # OpenAPI 스키마에서 생성한 API 계약 타입은 이것이 유일한 집행 수단이다.
      - name: Typecheck ratchet
        run: npm run typecheck:ratchet

      - name: Production build
        run: npm run build

  frontend-e2e:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser behavior tests
        run: npm run test:e2e

  # ── 자동 배포 (urban-blanks 패턴) ─────────────────────────────────────
  # main push 에서 관련 품질 잡이 모두 성공하면 OCI VM 에 rsync → compose build/up → 라이브 스모크.
  # 시크릿: OCI_HOST / OCI_SSH_USER / OCI_SSH_KEY. .env.oci·.env.frontend.oci·cloudflared 설정은 VM 에 상주.
  deploy-oci:
    needs: [changes, backend-ci, frontend-ci, frontend-e2e, deployment-config-ci, mobile-ci]
    if: >-
      !cancelled() && !failure() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')) ||
       github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-oci
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan 기본 타임아웃은 5초이고, 실패하면 `bash -e` 로 배포 전체가
          # 조용히 죽는다. 호스트 키 검증은 유지한 채 타임아웃을 늘리고 재시도하며,
          # 끝내 실패하면 원인을 로그에 남기고 끝낸다(OCI_HOST 가 옛 IP 를 가리키면
          # 여기서 걸린다 — 2026-07-30 배포 실패 원인).
          for attempt in 1 2 3; do
            if ssh-keyscan -T 20 -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null; then
              if [ -s ~/.ssh/known_hosts ]; then
                echo "ssh-keyscan ok (attempt $attempt)"
                exit 0
              fi
            fi
            echo "ssh-keyscan failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "ssh-keyscan failed after 3 attempts" >&2
          exit 1

      - name: Sync code to VM
        run: |
          RSYNC_RSH="ssh -i ~/.ssh/deploy_key" rsync -az --delete \
            --exclude='.venv' --exclude='node_modules' --exclude='.nuxt' --exclude='.output' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.env*' \
            backend frontend scripts docker-compose.oci.yml \
            "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}:/opt/maeil1dok/"

      - name: Build and roll out
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_HOST }}" '
            set -e
            cd /opt/maeil1dok
            docker compose -f docker-compose.oci.yml --env-file .env.oci build web celery-worker celery-beat frontend
            docker compose -f docker-compose.oci.yml --env-file .env.oci up -d web celery-worker celery-beat frontend cloudflared
            docker image prune -f >/dev/null
          '

      - name: Smoke test (via Cloudflare Tunnel)
        run: |
          sleep 15
          for i in $(seq 1 30); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.maeil1dok.app/health/ || true)
            ready=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.maeil1dok.app/ready/ || true)
            fe=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://maeil1dok.app/ || true)
            echo "attempt $i: api=/health/ $api, api=/ready/ $ready, frontend $fe"
            if [ "$api" = "200" ] && [ "$ready" = "200" ] && [ "$fe" = "200" ]; then echo "SMOKE OK"; exit 0; fi
            sleep 10
          done
          echo "SMOKE FAILED"; exit 1
