name: CI

on:
  push:
    branches: [main]
    paths:
      - 'maeil1dok-next/**'
      - 'backend/**'
      - 'frontend/**'
      - 'railway/**'
      - 'docs/railway-migration-runbook.md'
      - 'tests/test_railway_deployment_config.py'
      - 'tests/test_frontend_deployment_config.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'maeil1dok-next/**'
      - 'backend/**'
      - 'frontend/**'
      - 'railway/**'
      - 'docs/railway-migration-runbook.md'
      - 'tests/test_railway_deployment_config.py'
      - 'tests/test_frontend_deployment_config.py'
      - '.github/workflows/ci.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      maeil1dok-next: ${{ steps.filter.outputs.maeil1dok-next }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deployment: ${{ steps.filter.outputs.deployment }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            maeil1dok-next:
              - 'maeil1dok-next/**'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            deployment:
              - 'railway/**'
              - 'docs/railway-migration-runbook.md'
              - 'tests/test_railway_deployment_config.py'
              - 'tests/test_frontend_deployment_config.py'
              - '.github/workflows/ci.yml'

  maeil1dok-next-ci:
    needs: changes
    if: needs.changes.outputs.maeil1dok-next == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maeil1dok-next

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: maeil1dok-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.test_settings
      KAKAO_CLIENT_ID: ci-kakao-client
      KAKAO_REDIRECT_URI: http://localhost/auth/kakao/callback
      GOOGLE_CLIENT_ID: ci-google-client
      GOOGLE_CLIENT_SECRET: ci-google-secret
      GOOGLE_REDIRECT_URI: http://localhost/auth/google/callback
      APPLE_CLIENT_ID: ci.apple.client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install MySQL build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Account migrations
        run: python manage.py migrate --noinput

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Account tests
        run: python manage.py test accounts

  deployment-config-ci:
    needs: changes
    if: needs.changes.outputs.deployment == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Railway deployment contract tests
        run: python -m unittest tests.test_railway_deployment_config tests.test_frontend_deployment_config

  frontend-ci:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Account contract tests
        run: npm run test

      - name: Production build
        run: npm run build
