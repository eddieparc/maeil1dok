previews:
  generation: "off"

services:
  - type: pserv
    name: maeil1dok-mysql
    runtime: image
    plan: standard
    region: singapore
    image:
      url: docker.io/library/mysql:8.0
    disk:
      name: maeil1dok-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: dailybible
      - key: MYSQL_USER
        value: dailybible_user
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_ROOT_PASSWORD
        sync: false

  - type: keyvalue
    name: maeil1dok-redis
    plan: standard
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: maeil1dok-backend
    runtime: docker
    rootDir: backend
    plan: standard
    region: singapore
    healthCheckPath: /admin/login/
    domains:
      - api.maeil1dok.app
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_PASSWORD
      - key: DB_HOST
        fromService:
          type: pserv
          name: maeil1dok-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: api.maeil1dok.app,maeil1dok-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: '["https://maeil1dok.app","https://www.maeil1dok.app","https://maeil1dok-frontend.onrender.com"]'
      - key: CSRF_TRUSTED_ORIGINS
        value: '["https://maeil1dok.app","https://www.maeil1dok.app","https://api.maeil1dok.app","https://maeil1dok-frontend.onrender.com"]'
      - key: COOKIE_DOMAIN
        value: .maeil1dok.app
      - key: FRONTEND_URL
        value: https://maeil1dok.app
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_REDIRECT_URI
        value: https://maeil1dok.app/auth/kakao/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://maeil1dok.app/auth/google/callback
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@maeil1dok.app
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: HASENA_CRON_SECRET
        sync: false

  - type: worker
    name: maeil1dok-celery-worker
    runtime: docker
    rootDir: backend
    plan: standard
    region: singapore
    dockerCommand: celery -A config worker -l info
    envVars:
      - key: DEBUG
        value: "False"
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUN_COLLECTSTATIC
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_PASSWORD
      - key: DB_HOST
        fromService:
          type: pserv
          name: maeil1dok-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_REDIRECT_URI
        value: https://maeil1dok.app/auth/kakao/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: HASENA_CRON_SECRET
        sync: false

  - type: worker
    name: maeil1dok-celery-beat
    runtime: docker
    rootDir: backend
    plan: standard
    region: singapore
    dockerCommand: celery -A config beat -l info
    envVars:
      - key: DEBUG
        value: "False"
      - key: RUN_MIGRATIONS
        value: "false"
      - key: RUN_COLLECTSTATIC
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: maeil1dok-mysql
          envVarKey: MYSQL_PASSWORD
      - key: DB_HOST
        fromService:
          type: pserv
          name: maeil1dok-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: maeil1dok-redis
          property: connectionString
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_REDIRECT_URI
        value: https://maeil1dok.app/auth/kakao/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: HASENA_CRON_SECRET
        sync: false

  - type: web
    name: maeil1dok-frontend
    runtime: node
    rootDir: frontend
    plan: standard
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    domains:
      - maeil1dok.app
      - www.maeil1dok.app
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: NUXT_PUBLIC_API_BASE
        value: https://api.maeil1dok.app
      - key: NUXT_INTERNAL_API_BASE
        value: https://api.maeil1dok.app
      - key: NUXT_PUBLIC_BIBLE_CACHE_URL
        value: https://api.maeil1dok.app
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_JS_KEY
        sync: false
      - key: KAKAO_REDIRECT_URI
        value: https://maeil1dok.app/auth/kakao/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://maeil1dok.app/auth/google/callback
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_REDIRECT_URI
        value: https://maeil1dok.app/auth/apple/callback
      - key: CRON_SECRET
        sync: false
      - key: HASENA_CRON_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
