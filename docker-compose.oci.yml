# maeil1dok OCI 프로덕션 스택 — 단일 Ampere A1 VM (urban-blanks 와 공존).
#
# Railway 대체: web(gunicorn) + celery-worker + celery-beat(단일) + mysql8 + redis.
# - TLS/라우팅은 공유 nginx(urban-blanks-nginx-1)가 종단: api.maeil1dok.app server block 이
#   http://maeil1dok-web:8000 으로 프록시(resolver 변수 upstream). 이 스택은 nginx 미포함.
# - 격리: 전용 외부 network `edge` 에 공유 nginx 와 maeil1dok web 만 연결(urban 의 db/redis 등에
#   측면 접근 차단). web 은 내부 network(maeil1dok_default)로 mysql/redis/celery 와 통신.
#   → 사전 준비(1회): `docker network create edge` + `docker network connect edge urban-blanks-nginx-1`
#     (urban nginx 재생성 없이 런타임 attach). urban compose 에 edge 를 tracked 로 선언해 CI 일관성 유지.
# - 데이터(mysql/redis)는 ${OCI_DATA_ROOT:-/mnt/data/maeil1dok} 하위에 바인드 마운트.
# - 정적파일은 whitenoise 가 서빙. 사용자 업로드 미디어 없음(R2 불필요).
#
# 실행:
#   sudo mkdir -p ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/{mysql,redis,backups}
#   docker network create edge 2>/dev/null || true
#   docker compose -f docker-compose.oci.yml --env-file .env.oci up -d --build
name: maeil1dok

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME 필수}
      MYSQL_USER: ${DB_USER:?DB_USER 필수}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필수}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 필수}
    volumes:
      - ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1500m
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 300m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.oci
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # entrypoint.sh: DB 대기 → migrate → collectstatic → gunicorn (DEBUG=False)
    #   web 가 healthy(포트 open) = migrate/collectstatic 완료 → worker/beat 는 이걸 게이트로 대기.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    # 네트워크: maeil1dok_default 자동 조인(외부 노출 없음). urban-blanks 와 공유 네트워크 금지.
    #   (공유 nginx/edge 접근은 web 서비스명 충돌로 urban 장애 유발 → 폐기. 라우팅은 cloudflared 터널.)
    mem_limit: 900m
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped

  # 프론트엔드 (Nuxt 4 SSR) — Cloudflare Tunnel 이 maeil1dok.app/www → frontend:3000 으로 라우팅.
  #   호스트 포트 미노출(터널만 도달). 런타임 env 는 .env.frontend.oci (secret, git 미포함, scp 배치).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.oci
    env_file: .env.frontend.oci
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 700m
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.oci
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      # web 가 마이그레이션을 끝내고 healthy 해진 뒤에만 태스크 소비(구스키마 실행 방지)
      web:
        condition: service_healthy
    entrypoint: []
    command: sh -c "celery -A config worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}"
    mem_limit: 600m
    cpus: 0.75
    logging: *default-logging
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.oci
    environment:
      - DEBUG=False
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      web:
        condition: service_healthy
    entrypoint: []
    # 반드시 단일 인스턴스 (예약 발행/알림 중복 방지)
    command: celery -A config beat -l info
    deploy:
      replicas: 1
    mem_limit: 300m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  # Cloudflare Tunnel — api.maeil1dok.app 를 아웃바운드 터널로 web:8000 에 라우팅.
  #   인바운드 포트 없음(80/443 미사용) → urban-blanks nginx/포트와 완전 분리, 공유 네트워크 없음.
  #   credentials + config.yml 기반(로컬 완전제어). ingress(api.maeil1dok.app → http://web:8000)는
  #   ${OCI_DATA_ROOT}/cloudflared/config.yml, 자격증명 JSON 은 같은 디렉토리(secret, git 미포함, scp 배치).
  cloudflared:
    image: cloudflare/cloudflared:2025.7.0
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    # 마운트된 secret(600, ubuntu 소유)을 읽기 위해 컨테이너 root(=호스트 root)로 실행.
    user: "0:0"
    volumes:
      - ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/cloudflared:/etc/cloudflared:ro
    depends_on:
      web:
        condition: service_healthy
    # (헬스체크 없음: cloudflared 이미지는 distroless(쉘 없음)라 CMD-SHELL 불가.
    #  터널 상태는 로그의 "Registered tunnel connection" + CF 대시보드로 관측.)
    mem_limit: 150m
    cpus: 0.3
    logging: *default-logging
    restart: unless-stopped
networks:
  default:
    name: maeil1dok_default
