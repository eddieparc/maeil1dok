# maeil1dok OCI 프로덕션 스택 — 단일 Ampere A1 VM (urban-blanks 와 공존).
#
# web(gunicorn) + Celery + MySQL/Redis + frontend + Cloudflare Tunnel + 관측성.
# - TLS/라우팅은 이 스택의 cloudflared가 아웃바운드 터널로 종단한다. 인바운드 포트와 nginx는 없다.
# - 앱은 maeil1dok_default, 로그 저장소는 maeil1dok_observability 격리망만 사용한다.
#   어느 쪽도 urban-blanks의 network/port/nginx를 공유하지 않는다.
# - 데이터(mysql/redis)는 ${OCI_DATA_ROOT:-/mnt/data/maeil1dok} 하위에 바인드 마운트.
# - 정적파일은 whitenoise 가 서빙. 사용자 업로드 미디어 없음(R2 불필요).
#
# 실행:
#   sudo mkdir -p ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/{mysql,redis,backups}
#   docker compose -f docker-compose.oci.yml --env-file .env.oci up -d --build
name: maeil1dok

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-core-environment: &backend-core-environment
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 필수}
  DB_NAME: ${DB_NAME:?DB_NAME 필수}
  DB_USER: ${DB_USER:?DB_USER 필수}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필수}
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-api.maeil1dok.app}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.maeil1dok.app}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  FRONTEND_URL: ${FRONTEND_URL:-https://maeil1dok.app}
  KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID 필수}
  KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI 필수}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
  SENTRY_SEND_DEFAULT_PII: "false"
  SENTRY_RELEASE: ${COMMIT_SHA:?COMMIT_SHA is required}

x-web-environment: &web-environment
  <<: *backend-core-environment
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  API_BIBLE_KEY: ${API_BIBLE_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
  WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
  CRON_SECRET: ${CRON_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  FROM_EMAIL: ${FROM_EMAIL:-noreply@maeil1dok.app}
  FROM_NAME: ${FROM_NAME:-매일일독}

x-worker-environment: &worker-environment
  <<: *backend-core-environment
  API_BIBLE_KEY: ${API_BIBLE_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
  WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
  WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  FROM_EMAIL: ${FROM_EMAIL:-noreply@maeil1dok.app}
  FROM_NAME: ${FROM_NAME:-매일일독}

services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME 필수}
      MYSQL_USER: ${DB_USER:?DB_USER 필수}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 필수}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 필수}
    volumes:
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/mysql
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1500m
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/redis
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 300m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *web-environment
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # entrypoint.sh: DB 대기 → migrate → collectstatic → gunicorn (DEBUG=False)
    #   web 가 healthy(포트 open) = migrate/collectstatic 완료 → worker/beat 는 이걸 게이트로 대기.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    # 네트워크: maeil1dok_default 자동 조인(외부 노출 없음). urban-blanks 와 공유 네트워크 금지.
    #   (공유 nginx/edge 접근은 web 서비스명 충돌로 urban 장애 유발 → 폐기. 라우팅은 cloudflared 터널.)
    mem_limit: 900m
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped

  # 프론트엔드 (Nuxt 4 SSR) — Cloudflare Tunnel 이 maeil1dok.app/www → frontend:3000 으로 라우팅.
  #   호스트 포트 미노출(터널만 도달). 런타임 env 는 .env.frontend.oci (secret, git 미포함, scp 배치).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.oci
      secrets:
        - sentry_auth_token
      args:
        # 배포 워크플로가 COMMIT_SHA 를 넘긴다. 없으면 unknown 으로 떨어지고
        # 셸 OTA 게이트가 그 빌드를 거부한다 — 조용히 통과시키는 것보다 낫다.
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
        SENTRY_RELEASE: ${COMMIT_SHA:?COMMIT_SHA is required}
        SENTRY_ORG: ${SENTRY_ORG:?SENTRY_ORG is required}
        SENTRY_PROJECT: ${SENTRY_PROJECT:?SENTRY_PROJECT is required}
    env_file: .env.frontend.oci
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - SENTRY_RELEASE=${COMMIT_SHA:?COMMIT_SHA is required}
      - NUXT_PUBLIC_SENTRY_RELEASE=${COMMIT_SHA:?COMMIT_SHA is required}
      # Nuxt public runtimeConfig는 실행 시 NUXT_PUBLIC_* 이름으로만 override된다.
      # 백엔드와 공유하는 OAuth 값(.env.oci)을 공개 런타임 이름으로 명시적으로 전달한다.
      - NUXT_PUBLIC_KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID 필수}
      - NUXT_PUBLIC_KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI 필수}
      - NUXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID 필수}
      - NUXT_PUBLIC_GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI 필수}
      - NUXT_PUBLIC_APPLE_CLIENT_ID=${APPLE_CLIENT_ID:?APPLE_CLIENT_ID 필수}
      - NUXT_PUBLIC_APPLE_REDIRECT_URI=${APPLE_REDIRECT_URI:-https://maeil1dok.app/auth/apple/callback}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 700m
    cpus: 1.0
    logging: *default-logging
    restart: unless-stopped
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *worker-environment
    depends_on:
      # web 가 마이그레이션을 끝내고 healthy 해진 뒤에만 태스크 소비(구스키마 실행 방지)
      web:
        condition: service_healthy
    entrypoint: []
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    mem_limit: 600m
    cpus: 0.75
    logging: *default-logging
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-core-environment
    depends_on:
      web:
        condition: service_healthy
    entrypoint: []
    # 반드시 단일 인스턴스 (예약 발행/알림 중복 방지)
    command: celery -A config beat -l info
    deploy:
      replicas: 1
    mem_limit: 300m
    cpus: 0.5
    logging: *default-logging
    restart: unless-stopped

  # Cloudflare Tunnel — api.maeil1dok.app 를 아웃바운드 터널로 web:8000 에 라우팅.
  #   인바운드 포트 없음(80/443 미사용) → urban-blanks nginx/포트와 완전 분리, 공유 네트워크 없음.
  #   credentials + config.yml 기반(로컬 완전제어). ingress(api.maeil1dok.app → http://web:8000)는
  #   ${OCI_DATA_ROOT}/cloudflared/config.yml, 자격증명 JSON 은 같은 디렉토리(secret, git 미포함, scp 배치).
  cloudflared:
    image: cloudflare/cloudflared:2025.7.0
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --config /etc/cloudflared/config.yml run
    # 마운트된 secret(600, ubuntu 소유)을 읽기 위해 컨테이너 root(=호스트 root)로 실행.
    user: "0:0"
    volumes:
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/cloudflared
        target: /etc/cloudflared
        read_only: true
    depends_on:
      web:
        condition: service_healthy
    # (헬스체크 없음: cloudflared 이미지는 distroless(쉘 없음)라 CMD-SHELL 불가.
    #  터널 상태는 로그의 "Registered tunnel connection" + CF 대시보드로 관측.)
    mem_limit: 150m
    cpus: 0.3
    logging: *default-logging
    restart: unless-stopped

  # 중앙 로그 저장소. 호스트 포트 없이 격리된 observability 내부망에서만 접근하며,
  # 단일 노드 filesystem TSDB를 30일 보존한다.
  loki:
    image: grafana/loki:3.5.5
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./ops/loki/config.yml:/etc/loki/config.yml:ro
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/loki
        target: /loki
    networks:
      - observability
    mem_limit: 350m
    cpus: 0.35
    logging: *default-logging
    restart: unless-stopped

  # Docker API를 read-only endpoint allowlist로 제한한다. Alloy에는 socket을 직접 주지 않는다.
  docker-proxy:
    build:
      context: ./ops/docker-proxy
      dockerfile: Dockerfile
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
    mem_limit: 32m
    cpus: 0.05
    logging: *default-logging
    restart: unless-stopped

  # Docker API에서 이 compose project의 로그만 읽어 Loki로 전달한다.
  alloy:
    image: grafana/alloy:v1.10.2
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/alloy
        target: /var/lib/alloy/data
    depends_on:
      - loki
      - docker-proxy
    networks:
      - observability
    mem_limit: 200m
    cpus: 0.2
    logging: *default-logging
    restart: unless-stopped

  alert-probe:
    build:
      context: ./ops/probes
      dockerfile: Dockerfile
    environment:
      DJANGO_HEALTH_URL: https://api.maeil1dok.app/health/
      DJANGO_READY_URL: https://api.maeil1dok.app/ready/
      FRONTEND_HEALTH_URL: https://maeil1dok.app/api/health
      LOKI_READY_URL: http://loki:3100/ready
      ALLOY_READY_URL: http://alloy:12345/-/ready
      BACKUP_RECEIPT_PATH: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/backups/last-success.json
      ALERT_STATE_PATH: /state/status
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY 필수}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:?OPS_ALERT_EMAIL 필수}
      OPS_ALERT_FROM: ${OPS_ALERT_FROM:?OPS_ALERT_FROM 필수}
      OPS_PROBE_INTERVAL_SECONDS: ${OPS_PROBE_INTERVAL_SECONDS:-60}
      OPS_PROBE_STARTUP_GRACE_SECONDS: ${OPS_PROBE_STARTUP_GRACE_SECONDS:-120}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-108000}
      LOKI_DATA_PATH: /loki-data
      DISK_MIN_FREE_PERCENT: ${DISK_MIN_FREE_PERCENT:-15}
    volumes:
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/backups
        target: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/backups
        read_only: true
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/loki
        target: /loki-data
        read_only: true
      - type: bind
        source: ${OCI_DATA_ROOT:-/mnt/data/maeil1dok}/alerts
        target: /state
    networks:
      - default
      - observability
    healthcheck:
      test: ["CMD-SHELL", "test -f /state/status && test $$(( $$(date +%s) - $$(stat -c %Y /state/status) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    mem_limit: 64m
    cpus: 0.1
    logging: *default-logging
    restart: unless-stopped
networks:
  default:
    name: maeil1dok_default
  observability:
    name: maeil1dok_observability
    internal: true
secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
